name: CPU workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install . -r benchmarks/study_drivers/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          MATPILOT_DATA_DIR: ${{ runner.temp }}/matpilot-tests
      - run: node --test benchmarks/harness_study.test.mjs benchmarks/study_drivers/harness_bridge.test.mjs
        env:
          MATPILOT_TEST_PYTHON: python
      - run: node --test benchmarks/deployment/*.test.mjs
